<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Smooth drop shadow for optional modern depth -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="care-manpower-logo">
    <!-- Top-Left Arc (Cyan / Teal) -->
    <path 
      d="M 116 345 A 170 170 0 0 1 232 71" 
      fill="none" 
      stroke="#00A29D" 
      stroke-width="22" 
      stroke-linecap="round" 
    />

    <!-- Top-Right Arc (Crimson Red) -->
    <path 
      d="M 268 71 A 170 170 0 0 1 394 330" 
      fill="none" 
      stroke="#D22638" 
      stroke-width="22" 
      stroke-linecap="round" 
    />

    <!-- Bottom Supporting Hand (Deep Violet / Purple) -->
    <path 
      d="M 124 358 
         C 145 390, 195 422, 250 422 
         C 305 422, 355 390, 386 346 
         C 398 330, 405 308, 396 288 
         C 390 274, 374 274, 366 288 
         C 358 302, 348 316, 336 308 
         C 328 302, 328 278, 318 275 
         C 308 272, 300 282, 300 295 
         C 298 316, 280 330, 250 332 
         C 208 334, 165 324, 124 358 Z" 
      fill="#63256F" 
    />

    <!-- Left Figure (Aqua / Bright Cyan) -->
    <!-- Head -->
    <circle cx="178" cy="188" r="13.5" fill="#00A8B5" />
    <!-- Torso -->
    <path 
      d="M 152 272 C 152 224, 204 224, 204 272" 
      fill="none" 
      stroke="#00A8B5" 
      stroke-width="15" 
      stroke-linecap="round" 
    />

    <!-- Center Figure (Teal / Deep Emerald) -->
    <!-- Head -->
    <circle cx="250" cy="148" r="16" fill="#0B7E76" />
    <!-- Torso -->
    <path 
      d="M 218 248 C 218 192, 282 192, 282 248" 
      fill="none" 
      stroke="#0B7E76" 
      stroke-width="18" 
      stroke-linecap="round" 
    />

    <!-- Right Figure (Royal Blue) -->
    <!-- Head -->
    <circle cx="322" cy="188" r="13.5" fill="#1F6EB8" />
    <!-- Torso -->
    <path 
      d="M 296 272 C 296 224, 348 224, 348 272" 
      fill="none" 
      stroke="#1F6EB8" 
      stroke-width="15" 
      stroke-linecap="round" 
    />
  </g>
</svg>